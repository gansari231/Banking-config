server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Look at the last 5 calls
resilience4j.circuitbreaker.instances.customerService.slidingWindowSize=5
#Don't evaluate before 5 requests
resilience4j.circuitbreaker.instances.customerService.minimumNumberOfCalls=5
#Open if 50% fail
resilience4j.circuitbreaker.instances.customerService.failureRateThreshold=50
#Stay open for 10 seconds
resilience4j.circuitbreaker.instances.customerService.waitDurationInOpenState=10s
#Test recovery with 2 requests
resilience4j.circuitbreaker.instances.customerService.permittedNumberOfCallsInHalfOpenState=2